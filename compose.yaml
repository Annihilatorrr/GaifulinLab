name: gaifulinlab

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gaifulinlab}
      POSTGRES_USER: ${POSTGRES_USER:-gaifulinlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-gaifulinlab};Username=${POSTGRES_USER:-gaifulinlab};Password=${POSTGRES_PASSWORD}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-GaifulinLab}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-GaifulinLab.Web.Client}
      JWT_LIFETIME_MINUTES: ${JWT_LIFETIME_MINUTES:-30}
      MEDIA_STORAGE_PATH: /app/data/media
      APPLY_DATABASE_MIGRATIONS: "true"
      HTTPS_REDIRECT_ENABLED: "false"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  media_data:
