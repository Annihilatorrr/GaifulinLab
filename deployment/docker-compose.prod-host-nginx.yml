name: gaifulinlab

services:
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
    container_name: gaifulinlab-prod-web-host-nginx
    restart: unless-stopped
    extra_hosts:
      # Linux containers use this alias to reach PostgreSQL installed on the Docker host.
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=${GAIFULINLAB_DB_HOST};Port=${GAIFULINLAB_DB_PORT};Database=${GAIFULINLAB_DB_NAME};Username=${GAIFULINLAB_DB_USER};Password=${GAIFULINLAB_DB_PASSWORD}
      ADMIN_LOGIN: ${GAIFULINLAB_ADMIN_LOGIN}
      ADMIN_PASSWORD_HASH: ${GAIFULINLAB_ADMIN_PASSWORD_HASH}
      JWT_ISSUER: ${GAIFULINLAB_JWT_ISSUER:-GaifulinLab}
      JWT_AUDIENCE: ${GAIFULINLAB_JWT_AUDIENCE:-GaifulinLab.Web.Client}
      JWT_SIGNING_KEY: ${GAIFULINLAB_JWT_SIGNING_KEY:?Set GAIFULINLAB_JWT_SIGNING_KEY in deployment/.env}
      JWT_LIFETIME_MINUTES: ${GAIFULINLAB_JWT_LIFETIME_MINUTES:-30}
      MEDIA_STORAGE_PATH: /app/media
      APPLY_DATABASE_MIGRATIONS: "false"
      HTTPS_REDIRECT_ENABLED: "false"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - ${GAIFULINLAB_MEDIA_HOST_PATH:-./runtime/media}:/app/media
    # Both binds reach the same ASP.NET host. Host nginx keeps public /api/
    # routing explicit while the application serves SSR and WebAssembly assets.
    ports:
      - "127.0.0.1:${GAIFULINLAB_HOST_NGINX_BACKEND_HTTP_PORT:-38190}:8080"
      - "127.0.0.1:${GAIFULINLAB_HOST_NGINX_API_HTTP_PORT:-38191}:8080"
    networks:
      - gaifulinlab-host-nginx

# PostgreSQL intentionally remains a shared host service and is never created by this Compose project.
networks:
  gaifulinlab-host-nginx:
    name: gaifulinlab-host-nginx
