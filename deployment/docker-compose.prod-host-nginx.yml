name: gaifulinlab

services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    container_name: gaifulinlab-prod-api-host-nginx
    restart: unless-stopped
    extra_hosts:
      # Linux containers use this alias to reach PostgreSQL installed on the Docker host.
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=${GAIFULINLAB_DB_HOST};Port=${GAIFULINLAB_DB_PORT};Database=${GAIFULINLAB_DB_NAME};Username=${GAIFULINLAB_DB_USER};Password=${GAIFULINLAB_DB_PASSWORD}
      IDENTITY_BOOTSTRAP_ADMIN_LOGIN: ${GAIFULINLAB_IDENTITY_BOOTSTRAP_ADMIN_LOGIN}
      IDENTITY_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${GAIFULINLAB_IDENTITY_BOOTSTRAP_ADMIN_PASSWORD_HASH}
      JWT_ISSUER: ${GAIFULINLAB_JWT_ISSUER:-GaifulinLab}
      JWT_AUDIENCE: ${GAIFULINLAB_JWT_AUDIENCE:-GaifulinLab.Web}
      JWT_SIGNING_KEY: ${GAIFULINLAB_JWT_SIGNING_KEY:?Set GAIFULINLAB_JWT_SIGNING_KEY in deployment/.env}
      JWT_LIFETIME_MINUTES: ${GAIFULINLAB_JWT_LIFETIME_MINUTES:-30}
      MEDIA_STORAGE_PATH: /app/media
      PDF_RENDERER_TIMEOUT_SECONDS: ${GAIFULINLAB_PDF_RENDERER_TIMEOUT_SECONDS:-45}
      PDF_MAX_CONCURRENT_RENDERS: ${GAIFULINLAB_PDF_MAX_CONCURRENT_RENDERS:-2}
      APPLY_DATABASE_MIGRATIONS: "false"
      HTTPS_REDIRECT_ENABLED: "false"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - ${GAIFULINLAB_MEDIA_HOST_PATH:-./runtime/media}:/app/media
      - ${GAIFULINLAB_PDF_EXPORTS_HOST_PATH:-./runtime/pdf-exports}:/app/media/pdf-exports
    networks:
      - gaifulinlab-host-nginx

  pdf-worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.pdf-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=${GAIFULINLAB_DB_HOST};Port=${GAIFULINLAB_DB_PORT};Database=${GAIFULINLAB_DB_NAME};Username=${GAIFULINLAB_DB_USER};Password=${GAIFULINLAB_DB_PASSWORD}
      MEDIA_STORAGE_PATH: /app/media
      PDF_RENDERER_TIMEOUT_SECONDS: ${GAIFULINLAB_PDF_RENDERER_TIMEOUT_SECONDS:-45}
      PDF_MAX_CONCURRENT_RENDERS: ${GAIFULINLAB_PDF_MAX_CONCURRENT_RENDERS:-1}
      PDF_WORKER_POLL_INTERVAL_MILLISECONDS: ${GAIFULINLAB_PDF_WORKER_POLL_INTERVAL_MILLISECONDS:-1000}
      PDF_WORKER_LEASE_SECONDS: ${GAIFULINLAB_PDF_WORKER_LEASE_SECONDS:-120}
      APPLY_DATABASE_MIGRATIONS: "false"
      HTTPS_REDIRECT_ENABLED: "false"
    volumes:
      - ${GAIFULINLAB_MEDIA_HOST_PATH:-./runtime/media}:/app/media
      - ${GAIFULINLAB_PDF_EXPORTS_HOST_PATH:-./runtime/pdf-exports}:/app/media/pdf-exports
    networks:
      - gaifulinlab-host-nginx

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
      args:
        API_BASE_URL: /
    container_name: gaifulinlab-prod-web-host-nginx
    restart: unless-stopped
    depends_on:
      - api
    # Bind only to localhost so host nginx remains the public owner of ports 80 and 443.
    ports:
      - "127.0.0.1:${GAIFULINLAB_HOST_NGINX_BACKEND_HTTP_PORT:-38190}:80"
    networks:
      - gaifulinlab-host-nginx

# PostgreSQL intentionally remains a shared host service and is never created by this Compose project.
networks:
  gaifulinlab-host-nginx:
    name: gaifulinlab-host-nginx
