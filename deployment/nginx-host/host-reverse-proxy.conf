# Never log query strings: future callback/reset/realtime endpoints must not leak credentials into access logs.
log_format gaifulinlab_no_args '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

# This site is deliberately name-specific: it never becomes default_server and cannot claim other hosted apps.
server {
    listen 80;
    server_name __GAIFULINLAB_HOST_NGINX_SERVER_NAMES__;
    access_log /var/log/nginx/gaifulinlab.access.log gaifulinlab_no_args;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __GAIFULINLAB_HOST_NGINX_SERVER_NAMES__;

    ssl_certificate __GAIFULINLAB_HOST_NGINX_CERT_FILE__;
    ssl_certificate_key __GAIFULINLAB_HOST_NGINX_CERT_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/gaifulinlab.access.log gaifulinlab_no_args;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Host nginx terminates TLS and proxies every public request to the Web nginx
    # container. That container serves the SPA and routes API, health, and media paths
    # to the private API service inside the Docker network.
    location / {
        proxy_pass http://127.0.0.1:__GAIFULINLAB_HOST_NGINX_BACKEND_HTTP_PORT__;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
