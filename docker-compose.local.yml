# The API and Web application run from Visual Studio. Docker is used locally
# only for the Chromium-based PDF worker.
name: gaifulinlab-local

services:
  pdf-worker:
    build:
      context: .
      dockerfile: deployment/Dockerfile.pdf-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Matches src/GaifulinLab.Api/appsettings.Development.json.
      ConnectionStrings__Postgres: Host=host.docker.internal;Port=5435;Database=gaifulinlab;Username=gaifulinlab;Password=gaifulinlab
      MEDIA_STORAGE_PATH: /app/media
      PDF_RENDERER_TIMEOUT_SECONDS: "45"
      PDF_MAX_CONCURRENT_RENDERS: "1"
      PDF_WORKER_ENABLED: "true"
      PDF_WORKER_POLL_INTERVAL_MILLISECONDS: "1000"
      PDF_WORKER_LEASE_SECONDS: "120"
      APPLY_DATABASE_MIGRATIONS: "false"
      HTTPS_REDIRECT_ENABLED: "false"
    volumes:
      # API and worker use the same files for uploaded images and generated PDFs.
      - ./runtime/media:/app/media
